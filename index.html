<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier — procedural ruined city</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="panel">
      <h1>Frontier</h1>
      <p class="sub">Procedural abandoned city</p>

      <label>Seed
        <div class="row">
          <input id="seed" type="text" value="frontier-01" spellcheck="false" />
          <button id="dice" title="Random seed">&#9856;</button>
        </div>
      </label>

      <label>Buildings per lot <output id="o-density"></output>
        <input id="density" type="range" min="0.2" max="1" step="0.05" value="0.6" />
      </label>
      <label>Destruction <output id="o-damage"></output>
        <input id="damage" type="range" min="0" max="2" step="0.05" value="1" />
      </label>
      <label>Vegetation <output id="o-veg"></output>
        <input id="veg" type="range" min="0" max="2" step="0.05" value="1" />
      </label>
      <label>City size <output id="o-size"></output>
        <input id="size" type="range" min="240" max="520" step="20" value="360" />
      </label>

      <button id="generate" class="primary">Generate city</button>

      <fieldset>
        <legend>Show</legend>
        <label class="check"><input type="checkbox" id="t-cracks" checked /> Cracks</label>
        <label class="check"><input type="checkbox" id="t-plants" checked /> Plants &amp; vines</label>
        <label class="check"><input type="checkbox" id="t-props" checked /> Props &amp; debris</label>
      </fieldset>

      <div id="status">Starting…</div>
      <div id="stats"></div>
      <div id="breakdown"></div>
      <button id="export">Export building plan (JSON)</button>
    </aside>
    <main id="view"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
